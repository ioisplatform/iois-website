<script>
    function loadDashboardData() {
        const userid = localStorage.getItem('iois_user_id');
        const name = localStorage.getItem('iois_user_name');
        const email = localStorage.getItem('iois_user_email');
        const phone = localStorage.getItem('iois_user_phone');
        const upi = localStorage.getItem('iois_user_upi');

        // अगर बिना लॉगिन किए कोई डैशबोर्ड खोले, तो उसे होमपेज पर भेज दो
        if (!userid || userid === "null" || userid === "undefined") {
            alert("⚠️ कृपया पहले लॉगिन या रजिस्ट्रेशन करें!");
            window.location.href = "index.html";
            return;
        }

        // असली नाम सेट करें (अगर नाम न मिले तो User ID दिखाएँ)
        const displayName = (name && name !== "null" && name !== "undefined") ? name : userid;
        const displayEmail = (email && email !== "null") ? email : "member@iois.in";
        const displayPhone = (phone && phone !== "null") ? phone : "8877490845";
        const displayUPI = (upi && upi !== "null") ? upi : "Not Added";

        // मास्क फ़ोन नंबर (+91 8877****45)
        let maskedPhone = displayPhone;
        if (displayPhone.length >= 10) {
            maskedPhone = "+91 " + displayPhone.substring(0, 4) + "****" + displayPhone.substring(8);
        }

        // डैशबोर्ड और 3D कार्ड में डेटा भरें
        document.getElementById('card-name').innerText = displayName;
        document.getElementById('card-id').innerText = userid;
        document.getElementById('card-email').innerText = displayEmail;
        document.getElementById('card-phone').innerText = maskedPhone;
        document.getElementById('card-upi').innerText = displayUPI;

        // प्रोफ़ाइल एडिट बॉक्स में डेटा भरें
        document.getElementById('edit-name').value = displayName;
        document.getElementById('edit-email').value = displayEmail;
        document.getElementById('edit-phone').value = displayPhone;
        document.getElementById('edit-upi').value = displayUPI;

        // QR कोड और रेफरल लिंक जनरेट करें
        document.getElementById('card-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=https://ioisplatform.github.io/iois-website/?ref=${userid}`;
        document.getElementById('ref-link').value = `https://ioisplatform.github.io/iois-website/?ref=${userid}`;

        // सेव की गई प्रोफ़ाइल फोटो लोड करें
        const savedPic = localStorage.getItem('iois_profile_pic_' + userid);
        if (savedPic) {
            document.getElementById('profile-img').src = savedPic;
        }
    }

    // FLAWLESS DOWNLOAD AS JPG
    function downloadIDCardJPG() {
        const cardEl = document.getElementById('id-card-element');
        alert("आपका 3D तिरंगा ID Card JPG इमेज फॉर्मेट में डाउनलोड हो रहा है...");

        html2canvas(cardEl, {
            scale: 3,
            useCORS: true,
            width: 500,
            height: 315,
            windowWidth: 1200
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = `IOIS_Tiranga_Silver_ID_Card.jpg`;
            link.href = canvas.toDataURL('image/jpeg', 1.0);
            link.click();
        });
    }

    // FLAWLESS DOWNLOAD AS PRINTABLE PDF
    function downloadIDCardPDF() {
        const cardEl = document.getElementById('id-card-element');
        alert("आपका 3D तिरंगा ID Card PDF फॉर्मेट में तैयार हो रहा है...");

        html2canvas(cardEl, {
            scale: 3,
            useCORS: true,
            width: 500,
            height: 315,
            windowWidth: 1200
        }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            
            const pdf = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: [100, 65]
            });

            pdf.addImage(imgData, 'PNG', 0, 0, 100, 65);
            pdf.save(`IOIS_Tiranga_Silver_ID_Card.pdf`);
        });
    }

    function uploadProfilePic(input) {
        const file = input.files[0];
        const userid = localStorage.getItem('iois_user_id') || 'Guest';
        if (file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                document.getElementById('profile-img').src = e.target.result;
                localStorage.setItem('iois_profile_pic_' + userid, e.target.result);
                alert("Profile Picture Updated!");
            };
            reader.readAsDataURL(file);
        }
    }

    function updateUserProfileDetails(e) {
        e.preventDefault();
        const newName = document.getElementById('edit-name').value.trim();
        const newEmail = document.getElementById('edit-email').value.trim();
        const newPhone = document.getElementById('edit-phone').value.trim();
        const newUPI = document.getElementById('edit-upi').value.trim();

        if (newName) localStorage.setItem('iois_user_name', newName);
        if (newEmail) localStorage.setItem('iois_user_email', newEmail);
        if (newPhone) localStorage.setItem('iois_user_phone', newPhone);
        if (newUPI) localStorage.setItem('iois_user_upi', newUPI);

        alert("प्रोफ़ाइल जानकारी सफलतापूर्वक अपडेट हो गई!");
        loadDashboardData();
    }
</script>
