<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS - ताज़ा समाचार एवं डिजिटल लाइव न्यूज़ फ़ीड</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#030712] text-white font-sans flex flex-col min-h-screen" onload="fetchLiveGoogleNews()">

    <nav class="bg-[#080d1e] border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2">
                <img src="assets/logo.png" onerror="this.src='https://via.placeholder.com/40'" alt="IOIS" class="w-10 h-10 rounded-full border border-amber-400">
                <span class="text-xl font-bold text-amber-400">IOIS Live Breaking News</span>
            </a>
            <a href="index.html" class="px-3.5 py-1.5 bg-amber-400 text-gray-950 font-bold rounded-xl text-xs"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full space-y-6">
        <div class="text-center">
            <span class="bg-red-600 text-white font-extrabold text-[10px] px-3 py-1 rounded-full uppercase tracking-wider">
                <i class="fa-solid fa-signal animate-pulse mr-1"></i> LIVE RSS FEED
            </span>
            <h1 class="text-3xl font-extrabold text-amber-400 mt-2">ताज़ा समाचार एवं राष्ट्रीय डिजिटल अपडेट्स</h1>
            <p class="text-xs text-gray-400 mt-1" id="live-news-time">Connecting to Live News Stream...</p>
        </div>

        <!-- LIVE NEWS FEED CONTAINER -->
        <div id="live-news-container" class="space-y-4 text-xs md:text-sm">
            <div class="bg-[#111c38] p-6 rounded-2xl text-center text-gray-400 font-bold">
                <i class="fa-solid fa-spinner fa-spin text-2xl text-amber-400 mb-2"></i><br>
                ताज़ा लाइव समाचार स्ट्रीम लोड हो रहा है...
            </div>
        </div>
    </main>

    <footer class="bg-[#080d1e] py-6 border-t border-gray-800 text-center text-xs text-gray-400 mt-auto">&copy; 2026 IOIS Platform</footer>

    <script>
        function fetchLiveGoogleNews() {
            var now = new Date();
            document.getElementById('live-news-time').innerText = "लाइव अपडेट समय: " + now.toLocaleTimeString('hi-IN');

            // LIVE INDIA NEWS RSS FEED CONVERTED TO JSON
            var rssUrl = encodeURIComponent("https://news.google.com/rss?hl=hi&gl=IN&ceid=IN:hi");
            
            fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`)
                .then(response => response.json())
                .then(data => {
                    var container = document.getElementById('live-news-container');
                    container.innerHTML = "";

                    if (data && data.items && data.items.length > 0) {
                        data.items.slice(0, 10).forEach((item, index) => {
                            var pubDate = new Date(item.pubDate).toLocaleTimeString('hi-IN', { hour: '2-digit', minute: '2-digit' });
                            
                            container.innerHTML += `
                                <div class="bg-[#111c38] border border-gray-800 p-5 rounded-2xl shadow-xl hover:border-amber-500/50 transition">
                                    <div class="flex justify-between items-center mb-1">
                                        <span class="text-[10px] bg-red-600/20 text-red-400 font-bold px-2 py-0.5 rounded border border-red-500/30">BREAKING #${index+1}</span>
                                        <span class="text-[10px] text-gray-400 font-bold"><i class="fa-solid fa-clock mr-1"></i> Today at ${pubDate}</span>
                                    </div>
                                    <h3 class="text-base font-bold text-white mb-2 leading-snug">${item.title}</h3>
                                    <a href="${item.link}" target="_blank" class="inline-block mt-2 text-xs text-amber-400 font-bold hover:underline">
                                        पूरा समाचार पढ़ें <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i>
                                    </a>
                                </div>
                            `;
                        });
                    } else {
                        showBackupNews();
                    }
                })
                .catch(err => {
                    showBackupNews();
                });
        }

        function showBackupNews() {
            var container = document.getElementById('live-news-container');
            container.innerHTML = `
                <div class="bg-[#111c38] border border-gray-800 p-5 rounded-2xl">
                    <span class="text-[10px] bg-teal-500/20 text-teal-400 font-bold px-2 py-0.5 rounded">DIGITAL INDIA</span>
                    <h3 class="text-base font-bold text-white my-1">भारत में वर्क-फ्रॉम-होम और डिजिटल यूपीआई पेआउट्स ने नया रिकॉर्ड बनाया</h3>
                    <p class="text-gray-300 text-xs">डिजिटल इंडिया पहल के तहत देश भर में ऑनलाइन वर्क-फ्रॉम-होम नौकरियों और इंस्टेंट वॉलेट पेआउट्स की माँग 45% बढ़ी।</p>
                </div>
            `;
        }
    </script>
</body>
</html>
