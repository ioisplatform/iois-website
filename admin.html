<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOIS - Admin Control Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Top Bar -->
        <div class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <h1 class="text-2xl font-bold text-amber-400"><i class="fa-solid fa-user-shield"></i> IOIS Admin Panel</h1>
            <a href="index.html" class="px-4 py-2 bg-gray-800 text-xs font-bold rounded-lg hover:bg-gray-700">Logout Admin</a>
        </div>

        <!-- Admin Stats -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                <p class="text-xs text-gray-400 font-bold uppercase">Total Registrations</p>
                <h3 class="text-3xl font-extrabold text-amber-400 mt-1">24</h3>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                <p class="text-xs text-gray-400 font-bold uppercase">Pending Screenshots</p>
                <h3 class="text-3xl font-extrabold text-red-400 mt-1">3 New</h3>
            </div>
            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700">
                <p class="text-xs text-gray-400 font-bold uppercase">Total Profit (30%)</p>
                <h3 class="text-3xl font-extrabold text-teal-400 mt-1">₹72</h3>
            </div>
        </div>

        <!-- User Verification Table -->
        <div class="bg-gray-800 rounded-xl border border-gray-700 p-6 overflow-x-auto">
            <h3 class="font-bold text-lg text-white mb-4">Pending Payment Verifications</h3>
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="bg-gray-900 text-gray-400 text-xs font-bold uppercase">
                        <th class="p-3">User Name</th>
                        <th class="p-3">User ID</th>
                        <th class="p-3">User UPI ID</th>
                        <th class="p-3">Amount</th>
                        <th class="p-3">Action</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-700">
                    <tr>
                        <td class="p-3 font-medium">Vikas Kumar</td>
                        <td class="p-3 text-amber-400 font-mono">vikas123</td>
                        <td class="p-3 text-gray-300">8877490845@spicepay</td>
                        <td class="p-3 font-bold text-teal-400">₹10</td>
                        <td class="p-3 flex gap-2">
                            <button onclick="alert('User Approved & Kit Link Unlocked!')" class="px-3 py-1 bg-green-600 text-xs font-bold rounded hover:bg-green-700">Approve</button>
                            <button onclick="alert('User Rejected!')" class="px-3 py-1 bg-red-600 text-xs font-bold rounded hover:bg-red-700">Reject</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
