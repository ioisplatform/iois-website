<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings & Preferences - IOIS Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-[#030712] text-white font-sans flex flex-col min-h-screen">

    <nav class="bg-[#080d1e] border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <span class="text-xl font-bold text-amber-400">IOIS Settings</span>
            <a href="index.html" class="px-3.5 py-1.5 bg-amber-400 text-gray-950 font-bold rounded-xl text-xs"><i class="fa-solid fa-house"></i> Home</a>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-10 flex-1 w-full space-y-6">
        <h1 class="text-2xl font-extrabold text-amber-400 text-center">Settings & Feedback</h1>

        <!-- Language Preference -->
        <div class="bg-[#111c38] border border-gray-800 p-6 rounded-2xl space-y-3">
            <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-globe text-amber-400 mr-2"></i> Select Website Language</h3>
            <select class="w-full bg-[#080d1e] border border-gray-700 rounded-xl p-3 text-xs text-white">
                <option value="hi" selected>हिंदी (Hindi)</option>
                <option value="en">English</option>
                <option value="mr">मराठी (Marathi)</option>
                <option value="bn">बंगाली (Bengali)</option>
            </select>
        </div>

        <!-- Feedback Box -->
        <div class="bg-[#111c38] border border-gray-800 p-6 rounded-2xl space-y-3">
            <h3 class="font-bold text-white text-sm"><i class="fa-solid fa-comment-dots text-teal-400 mr-2"></i> Send Feedback or Suggestion</h3>
            <form onsubmit="alert('फ़ीडबैक सबमिट हो गया!'); event.preventDefault();" class="space-y-3">
                <textarea rows="3" placeholder="अपना सुझाव या फ़ीडबैक यहाँ लिखें..." class="w-full bg-[#080d1e] border border-gray-700 rounded-xl p-3 text-xs text-white outline-none"></textarea>
                <button type="submit" class="w-full py-3 bg-amber-400 text-gray-950 font-bold rounded-xl text-xs">Submit Feedback</button>
            </form>
        </div>
    </main>

    <footer class="bg-[#080d1e] py-6 text-center text-xs text-gray-400 mt-auto">&copy; 2026 IOIS Platform</footer>
</body>
</html>
